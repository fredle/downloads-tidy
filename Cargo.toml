[package]
name = "downloads_tidy"
version = "0.1.1"
edition = "2024"
description = "Rule-based Downloads folder sorter with preview and one-click undo."
repository = "https://github.com/fredle/downloads-tidy"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
velopack = "1.2"
# Already in the build through velopack; used to send in-app feedback.
ureq = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.31"
